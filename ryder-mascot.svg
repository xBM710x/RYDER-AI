<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 100 100" style="overflow:visible">
  <style>
    .body{transform-origin:50% 80%;animation:rdBob 3.2s ease-in-out infinite}
    .eyes{transform-box:fill-box;transform-origin:center;animation:rdBlink 4.5s ease-in-out infinite}
    @keyframes rdBob{0%,100%{transform:translateY(0) rotate(0) scale(1,1)}25%{transform:translateY(-2px) rotate(-3deg) scale(.98,1.03)}50%{transform:translateY(0) rotate(0) scale(1.03,.97)}75%{transform:translateY(-1px) rotate(3deg) scale(.99,1.02)}}
    @keyframes rdBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
    @media (prefers-reduced-motion: reduce){.body,.eyes{animation:none}}
  </style>
  <defs>
    <linearGradient id="rb" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#F25C5C"/><stop offset="1" stop-color="#E03A3E"/></linearGradient>
    <filter id="rs" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#B91C1C" flood-opacity="0.25"/></filter>
  </defs>
  <g class="body">
    <path filter="url(#rs)" fill="url(#rb)" stroke="url(#rb)" stroke-width="11" stroke-linejoin="round" d="M50.0 16.0 L60.0 40.2 L86.1 42.3 L66.2 59.3 L72.3 84.7 L50.0 71.0 L27.7 84.7 L33.8 59.3 L13.9 42.3 L40.0 40.2 Z"/>
    <g class="eyes">
      <ellipse cx="43" cy="54" rx="3.8" ry="7.2" fill="#fff" transform="rotate(-15 43 54)"/>
      <ellipse cx="57" cy="54" rx="3.8" ry="7.2" fill="#fff" transform="rotate(-15 57 54)"/>
    </g>
  </g>
</svg>
